      <use href="#seat" x="0" y="76" width="26" height="26"/><use href="#seat" x="32" y="76" width="26" height="26"/><use href="#seat" x="96" y="76" width="26" height="26"/><use href="#seat" x="128" y="76" width="26" height="26"/><use href="#seat" x="246" y="76" width="26" height="26"/><use href="#seat" x="310" y="76" width="26" height="26"/><use href="#seat" x="342" y="76" width="26" height="26"/><use href="#seat" x="374" y="76" width="26" height="26"/>
      <use href="#seat" x="0" y="112" width="26" height="26"/><use href="#seat" x="32" y="112" width="26" height="26"/><use href="#seat" x="64" y="112" width="26" height="26"/><use href="#seat" x="128" y="112" width="26" height="26"/><use href="#seat" x="246" y="112" width="26" height="26"/><use href="#seat" x="278" y="112" width="26" height="26"/><use href="#seat" x="342" y="112" width="26" height="26"/><use href="#seat" x="374" y="112" width="26" height="26"/>
      <use href="#seat" x="0" y="148" width="26" height="26"/><use href="#seat" x="64" y="148" width="26" height="26"/><use href="#seat" x="96" y="148" width="26" height="26"/><use href="#seat" x="128" y="148" width="26" height="26"/><use href="#seat" x="246" y="148" width="26" height="26"/><use href="#seat" x="278" y="148" width="26" height="26"/><use href="#seat" x="310" y="148" width="26" height="26"/>
