    </radialGradient>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <symbol id="seat" viewBox="0 0 24 24"><path d="M4 10a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6H4z"/><rect x="2" y="14" width="20" height="4" rx="2"/></symbol>
    <style>.pick{animation:blink 1.8s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}</style>
  </defs>
  <rect width="1200" height="320" fill="url(#stage)"/>
